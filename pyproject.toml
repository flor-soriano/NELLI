[project]
name = "nelli"
version = "0.1.0"
description = "Nelli · verifica antes de creer, comprar o contestar. Las reglas deciden; la IA explica."
requires-python = ">=3.12"
license = {text = "AGPL-3.0-only"}
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest"]
qr = ["pyzbar", "Pillow"]
guard = ["transformers", "torch"]
# Nivel 0: probar Nelli completa sin llave con el emulador local (nelli.emulador). No es Muse.
emulador = ["rapidocr-onnxruntime==1.4.4", "faster-whisper==1.2.1", "Pillow==12.2.0", "numpy==2.3.5"]

[project.scripts]
nelli = "nelli.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nelli = ["esquema/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
